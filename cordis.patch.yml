# One plugin owns transport plus remote fs/shell Service Providers.
- id: fs-sandbox
  disabled: true
- id: bash-sandbox
  disabled: true
- id: permission
  config:
    defaultPreset: danger-full-access
    presets:
      read-only: { sandbox: read-only, approval: ask }
      workspace-write: { sandbox: workspace-write, approval: ask }
      danger-full-access: { sandbox: danger-full-access, approval: never }
- insert:
    - id: remote-exec
      name: '@morewax/dsh-remote-exec'
      config:
        driver: !!js (process.env.DSH_REMOTE_DRIVER || 'ssh')
        host: !!js process.env.DSH_REMOTE_HOST || ''
        user: !!js process.env.DSH_REMOTE_USER || ''
        root: !!js process.env.DSH_REMOTE_ROOT || '~'
        tailscale: !!js process.env.DSH_REMOTE_TAILSCALE === 'true'
